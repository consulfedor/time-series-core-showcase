<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DORI Camera Selector / Designer</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --panel-bg: #1a1d24;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --border: #2d3748;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg-color);
      color: var(--text-main);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .shell {
      width: 100%;
      max-width: 1240px;
      padding: 20px 20px 0;
    }
    .nav-bar {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 18px;
    }
    .nav-btn {
      padding: 10px 20px;
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
    }
    .nav-btn:hover { background-color: #2d3748; }
    .nav-btn.active-blue { border-color: var(--accent-blue); color: var(--accent-blue); }
    .nav-btn.active-green { border-color: var(--accent-green); color: var(--accent-green); }
    .mode-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 92px);
      min-height: 760px;
      border: 0;
      background: var(--bg-color);
    }
    @media (max-width: 860px) {
      .shell { padding: 12px 12px 0; }
      .nav-bar { grid-template-columns: 1fr; gap: 10px; }
      .mode-frame { height: calc(100vh - 132px); min-height: 820px; }
    }
  </style>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>

    <div class="nav-bar" role="tablist" aria-label="DORI calculation mode">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DORI Camera Selector / Designer</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #1a1d24;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --border: #2d3748;
            --radius: 12px;
            
            --zone-blind: #475569;
            --zone-detection: #10b981;
            --zone-observation: #3b82f6;
            --zone-recognition: #eab308;
            --zone-identification: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            
        }

        .nav-bar {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .nav-btn {
            padding: 10px 20px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background-color: #2d3748;
        }

        .nav-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 860px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        select, input[type="number"] {
            width: 100%;
            background-color: #0f1115;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="number"]:focus {
            border-color: var(--accent);
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

        .slider-group input[type="range"] {
            flex-grow: 1;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .slider-group input[type="number"] {
            width: 80px;
            text-align: center;
        }

        /* Results Panel */
        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .result-card {
            background-color: #0f1115;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .result-card span {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .result-card strong {
            display: block;
            font-size: 1.5rem;
            color: #fff;
        }

        .ppm-highlight {
            color: var(--accent) !important;
            font-size: 2rem !important;
        }

        /* Visualization */
        .visualization {
            margin-top: 30px;
        }

        .dori-status {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            background-color: var(--border);
            transition: all 0.3s;
        }

        .dori-bar {
            width: 100%;
            height: 24px;
            background-color: #0f1115;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .dori-segment {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: #000;
            opacity: 0.8;
            position: relative;
        }
        .dori-segment:hover {
            opacity: 1;
        }

        .opt-tick {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #fff;
            opacity: 0.6;
            z-index: 5;
        }

        .seg-blind { background-color: var(--zone-blind); width: 10%; color: #fff;} /* Up to 25 */
        .seg-detection { background-color: var(--zone-detection); width: 15%; } /* 25 to 61 */
        .seg-observation { background-color: var(--zone-observation); width: 20%; } /* 62 to 124 */
        .seg-recognition { background-color: var(--zone-recognition); width: 25%; } /* 125 to 249 */
        .seg-identification { background-color: var(--zone-identification); flex-grow: 1; } /* 250+ */

        .indicator {
            width: 4px;
            height: 32px;
            background-color: #fff;
            position: relative;
            top: -28px;
            margin-bottom: -32px;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
            transition: left 0.3s ease-out;
            z-index: 10;
        }

        .limits-list {
            list-style: none;
            background: #0f1115;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .limits-list li {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
            border-radius: 4px;
        }

        .limits-list li:hover {
            background-color: #2d3748;
        }

        .limits-list li:last-child {
            border-bottom: none;
        }

        .limits-list li span.dist {
            font-weight: 600;
            color: #fff;
        }
        
        .optics-type-toggle {
            display: flex;
            background: #0f1115;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 12px;
        }
        .optics-type-toggle button {
            flex: 1;
            padding: 8px;
            background: transparent;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .optics-type-toggle button.active {
            background: var(--border);
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Panel 1: Inputs -->
    <div class="panel">
        <h2>Camera and Scene Parameters</h2>
        
        <div class="form-group" title="Business purpose: Affects overall image detail. More megapixels allow one camera to cover a larger area without losing analytics quality.">
            <label for="resolution">Sensor Resolution (MP) ℹ️</label>
            <select id="resolution">
                <option value="1920x1080">2MP (1920x1080)</option>
                <option value="2048x1536">3MP (2048x1536)</option>
                <option value="2560x1440" selected>4MP (2560x1440)</option>
                <option value="2592x1944">5MP (2592x1944)</option>
                <option value="3840x2160">8MP / 4K (3840x2160)</option>
            </select>
        </div>

        <div class="form-group" title="Business purpose: Larger sensors, for example 1/2&quot;, capture more light and provide a wider field of view. This is critical for high-quality color night imaging.">
            <label for="sensor">Physical Sensor Size ℹ️</label>
            <select id="sensor">
                <option value="4.8" data-height="3.6">1/3" (4.8 x 3.6 mm)</option>
                <option value="5.27" data-height="2.96" selected>1/2.8" (5.27 x 2.96 mm)</option>
                <option value="5.37" data-height="3.02">1/2.7" (5.37 x 3.02 mm)</option>
                <option value="6.4" data-height="4.8">1/2" (6.4 x 4.8 mm)</option>
            </select>
        </div>

        <div class="form-group" style="margin-top: 24px;" title="Business purpose: Camera mounting height. Affects the blind zone below the camera and the real diagonal distance.">
            <label for="height-slider">Mounting Height (H, meters) ℹ️</label>
            <div class="slider-group">
                <input type="range" id="height-slider" min="1" max="20" step="0.5" value="3">
                <input type="number" id="height-input" min="1" max="20" step="0.5" value="3">
            </div>
        </div>

        <div class="form-group" title="Business purpose: Where the lens is aimed. AUTO points the camera directly at the target. If disabled, the lens can be tilted down or up manually.">
            <label for="tilt-slider">Vertical Tilt (deg) ℹ️</label>
            <div style="display: flex; align-items: center; margin-bottom: 8px;">
                <input type="checkbox" id="tilt-auto" checked style="width: auto; margin-right: 8px;">
                <label for="tilt-auto" style="margin-bottom: 0; display: inline;">Auto-aim at target</label>
            </div>
            <div class="slider-group">
                <input type="range" id="tilt-slider" min="0" max="90" step="1" value="16" disabled style="opacity: 0.5;">
                <input type="number" id="tilt-input" min="0" max="90" step="1" value="16" disabled style="opacity: 0.5;">
            </div>
        </div>

        <div class="form-group" title="Business purpose: Fixed lenses are cheaper and more durable. Varifocal lenses allow precise framing on the object, removing unnecessary walls and keeping only the controlled passage in frame.">
            <label>Lens Type ℹ️</label>
            <div class="optics-type-toggle" id="optics-toggle">
                <button type="button" class="active" data-type="varifocal">Varifocal (Precise Adjustment)</button>
                <button type="button" data-type="fixed">Fixed (Standard)</button>
            </div>
            
            <label for="focal-slider" title="Business purpose: A short focal length, such as 2.8 mm, gives wide perimeter coverage. A long focal length, 12 mm and above, works like binoculars for detailed control at longer distances.">Focal Length (mm) ℹ️</label>
            <select id="focal-fixed" style="display: none; margin-bottom: 8px;">
                <option value="2.8">2.8 mm (Wide-angle)</option>
                <option value="3.6" selected>3.6 mm (Standard)</option>
                <option value="4">4.0 mm</option>
                <option value="6">6.0 mm</option>
                <option value="8">8.0 mm</option>
                <option value="12">12.0 mm</option>
                <option value="16">16.0 mm</option>
                <option value="25">25.0 mm</option>
            </select>

            <div class="slider-group" id="focal-slider-group">
                <input type="range" id="focal-slider" min="2.8" max="50" step="0.1" value="3.6">
                <input type="number" id="focal-input" min="2.8" max="50" step="0.1" value="3.6">
            </div>
        </div>

        <div class="form-group" id="angle-group" style="margin-top: 16px;" title="Business purpose: Shows area coverage. A wide angle (>90 deg) is useful for yards and parking areas. A narrow angle (<40 deg) is useful for corridors and checkpoints.">
            <label for="angle-slider">Horizontal Field of View (deg) ℹ️</label>
            <div class="slider-group">
                <input type="range" id="angle-slider" min="5" max="170" step="1" value="73">
                <input type="number" id="angle-input" min="5" max="170" step="0.1" value="73.4">
            </div>
        </div>

        <div class="form-group" style="margin-top: 32px;" title="Business purpose: Slant distance from the camera lens to the critical point (hypotenuse). This is usually the distance measured with a laser rangefinder.">
            <label for="dist-slider">Distance to Target (Slant, m) ℹ️</label>
            <div class="slider-group">
                <input type="range" id="dist-slider" min="1" max="150" step="1" value="10">
                <input type="number" id="dist-input" min="1" max="150" step="1" value="10">
            </div>
        </div>
    </div>

    <!-- Panel 2: Results & Visualization -->
    <div class="panel">
        <h2>Calculation Results (DORI)</h2>
        
        <div class="result-grid">
            <div class="result-card" title="Business purpose: The main analytics quality criterion (EN 62676-4). The higher the number, the more small details, such as faces or banknotes, are distinguishable.">
                <span>Pixel Density (PPM) ℹ️</span>
                <strong id="res-ppm" class="ppm-highlight">0</strong>
            </div>
            <div class="result-card" title="Business purpose: How many meters of width fit into the frame at the selected distance. Important for covering fences and gates without blind zones.">
                <span>Scene Width (FOV) ℹ️</span>
                <strong id="res-fov">0 m</strong>
            </div>
            <div class="result-card" title="Business purpose: Actual field of view angle of the camera optical system.">
                <span>Horizontal Angle ℹ️</span>
                <strong id="res-angle">0°</strong>
            </div>
            <div class="result-card" title="Business purpose: Target control distance.">
                <span>Ground Distance ℹ️</span>
                <strong id="res-dist">0 m</strong>
            </div>
        </div>

        <div class="visualization">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px;">
                <!-- Top View SVG -->
                <div class="scene-visual" style="text-align: center; position: relative; background: #15181e; padding: 16px; border-radius: 8px; border: 1px solid var(--border);">
                    <div style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 8px;">Top View (Width Coverage)</div>
                    <svg id="fov-svg" viewBox="0 0 300 150" style="width: 100%; height: 150px; display: block; margin: 0 auto; overflow: visible;">
                        <defs>
                            <clipPath id="fov-clip">
                                <polygon id="fov-poly" points="150,14 50,130 250,130" />
                            </clipPath>
                        </defs>
                        <!-- Camera icon -->
                        <rect x="140" y="0" width="20" height="14" fill="#94a3b8" rx="2" />
                        <circle cx="150" cy="7" r="4" fill="#0f1115" />
                        <!-- Heatmap -->
                        <g clip-path="url(#fov-clip)" opacity="0.6">
                            <rect id="rect-blind" x="0" y="14" width="300" height="150" fill="var(--zone-blind)" />
                            <rect id="rect-d" x="0" y="14" width="300" height="0" fill="var(--zone-detection)" />
                            <rect id="rect-o" x="0" y="14" width="300" height="0" fill="var(--zone-observation)" />
                            <rect id="rect-r" x="0" y="14" width="300" height="0" fill="var(--zone-recognition)" />
                            <rect id="rect-i" x="0" y="14" width="300" height="0" fill="var(--zone-identification)" />
                        </g>
                        <!-- Outline -->
                        <polygon id="fov-poly-outline" points="150,14 50,130 250,130" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4" />
                        <!-- Target Line -->
                        <line id="target-dist-line" x1="50" y1="130" x2="250" y2="130" stroke="#fff" stroke-width="2" />
                        <text id="svg-dist-text" x="150" y="70" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" style="text-shadow: 0 1px 3px rgba(0,0,0,0.8);">10 m</text>
                    </svg>
                    <div style="margin-top: 8px; font-size: 0.85rem; font-weight: 500; color: #fff;">
                        Width: <span id="scene-width-label" style="color: var(--accent);">0 m</span>
                    </div>
                </div>

                <!-- Side View SVG -->
                <div class="scene-visual" style="position: relative; background: #0d1117; padding: 12px; border-radius: 8px; border: 1px solid var(--border);">
                    <div style="color: #94a3b8; font-size: 0.8rem; margin-bottom: 6px; text-align:center; letter-spacing:0.05em; text-transform: uppercase;">Side View - Mounting Geometry</div>
                    <svg id="side-svg" viewBox="0 0 420 240" style="width: 100%; height: auto; display: block; overflow: visible;">
                        <defs>
                            <clipPath id="side-clip">
                                <rect x="40" y="0" width="380" height="210" />
                            </clipPath>
                            <marker id="arr-end" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
                            </marker>
                            <marker id="arr-white" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                <path d="M0,0 L6,3 L0,6 Z" fill="#e2e8f0"/>
                            </marker>
                            <marker id="arr-orange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                <path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/>
                            </marker>
                        </defs>

                        <!-- Background -->
                        <rect x="0" y="0" width="420" height="240" fill="#0d1117"/>

                        <!-- Sky/wall area -->
                        <rect id="side-sky" x="40" y="0" width="380" height="200" fill="#111827"/>

                        <!-- Grid Lines (dynamic) -->
                        <g id="side-grid"></g>

                        <!-- DORI cone zones (clip to drawing area) -->
                        <g clip-path="url(#side-clip)" id="side-zones-group">
                            <polygon id="side-i"     fill="#ef4444" opacity="0"/>
                            <polygon id="side-r"     fill="#eab308" opacity="0"/>
                            <polygon id="side-o"     fill="#3b82f6" opacity="0"/>
                            <polygon id="side-d"     fill="#10b981" opacity="0"/>
                            <polygon id="side-blind" fill="#475569" opacity="0"/>
                        </g>

                        <!-- Ground line -->
                        <line x1="40" y1="200" x2="420" y2="200" stroke="#334155" stroke-width="1.5"/>
                        <!-- Ground fill -->
                        <rect x="40" y="200" width="380" height="40" fill="#1a2035"/>
                        <!-- Ground label -->
                        <text x="420" y="215" fill="#475569" font-size="9" text-anchor="end">ground</text>

                        <!-- Y-axis (wall/pole side) -->
                        <line x1="40" y1="0" x2="40" y2="210" stroke="#334155" stroke-width="1"/>

                        <!-- Mounting pole -->
                        <line id="side-pole" x1="44" y1="50" x2="44" y2="200" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

                        <!-- Blind zone polygon (separate layer, above zones) -->
                        <polygon id="side-blind-top" fill="#1e293b" clip-path="url(#side-clip)" opacity="0.85"/>

                        <!-- Hypotenuse ray (median — laser beam) -->
                        <line id="side-hyp-line" x1="44" y1="50" x2="250" y2="200"
                              stroke="#f97316" stroke-width="1.5" stroke-dasharray="6 4"
                              marker-end="url(#arr-orange)" opacity="0.9"/>

                        <!-- Top ray of cone -->
                        <line id="side-top-ray" x1="44" y1="50" x2="300" y2="100"
                              stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
                        <!-- Bottom ray of cone -->
                        <line id="side-bot-ray" x1="44" y1="50" x2="300" y2="200"
                              stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>

                        <!-- Camera icon group (rotates around lens center) -->
                        <g id="side-cam-group" transform="translate(44, 80)">
                            <!-- Camera body -->
                            <rect x="-10" y="-7" width="14" height="14" fill="#475569" rx="2"/>
                            <!-- Lens barrel -->
                            <polygon points="4,-5 4,5 12,7 12,-7" fill="#64748b"/>
                            <!-- Lens glass -->
                            <ellipse cx="12" cy="0" rx="4" ry="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
                            <ellipse cx="12" cy="0" rx="2" ry="2" fill="#60a5fa" opacity="0.6"/>
                            <!-- Mount bolt -->
                            <circle cx="-5" cy="0" r="2" fill="#94a3b8"/>
                        </g>

                        <!-- Height dimension line (left of pole) -->
                        <g id="side-height-dim">
                            <line id="side-hdim-line" x1="20" y1="80" x2="20" y2="200" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-end)"/>
                            <line id="side-hdim-top"  x1="15" y1="80"  x2="38" y2="80"  stroke="#94a3b8" stroke-width="1"/>
                            <line id="side-hdim-bot"  x1="15" y1="200" x2="38" y2="200" stroke="#94a3b8" stroke-width="1"/>
                            <text id="side-hdim-text" x="18" y="140" fill="#94a3b8" font-size="9" text-anchor="middle" transform="rotate(-90,18,140)">H = 3.0 m</text>
                        </g>

                        <!-- Ground distance dimension -->
                        <line id="side-gdim-line" x1="44" y1="218" x2="200" y2="218" stroke="#64748b" stroke-width="1" marker-end="url(#arr-end)"/>
                        <text id="side-gdim-text" x="120" y="230" fill="#64748b" font-size="9" text-anchor="middle">- m (ground)</text>

                        <!-- Target person (stick figure) -->
                        <g id="side-person">
                            <line id="person-body" x1="0" y1="0" x2="0" y2="-25" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
                            <circle id="person-head" cx="0" cy="-30" r="5" fill="none" stroke="#f8fafc" stroke-width="2"/>
                            <!-- Feet indicator -->
                            <circle cx="0" cy="0" r="2" fill="#f97316"/>
                        </g>
                                    <g id="side-person-17" stroke="#ef4444" stroke-width="1.5" opacity="0.8">
                                        <line id="person-17-body" x1="0" y1="0" x2="0" y2="-20" />
                                        <circle id="person-17-head" cx="0" cy="-24" r="3" fill="#ef4444" />
                                        <text id="person-17-text" x="5" y="-12" fill="#ef4444" font-size="8" font-family="sans-serif">1.7 m</text>
                                    </g>

                        <!-- Hypotenuse label (along the dashed line) -->
                        <text id="side-hyp-text" x="150" y="90" fill="#f97316" font-size="9" text-anchor="middle" transform="">🎯 - m (laser)</text>

                        <!-- Head-in-zone indicator -->
                        <text id="side-zone-label" x="220" y="20" fill="#94a3b8" font-size="9" text-anchor="middle"></text>

                    </svg>
                    <!-- Info row below SVG -->
                    <div style="display:flex; gap:16px; margin-top:8px; font-size:0.78rem; color:#94a3b8; justify-content: space-between; flex-wrap:wrap;">
                        <span>↕ Height: <strong id="scene-height-label" style="color:var(--accent)">-</strong></span>
                        <span id="side-blind-info" style="color:#ef4444;">Blind Zone: -</span>
                        <span id="side-horiz-info" style="color:#64748b;">Ground: - m</span>
                    </div>
                </div>
            </div>

            <div id="dori-status" class="dori-status" title="Business purpose: Which security task the camera can reliably solve at this distance.">Loading...</div>
            
            <div style="position: relative;">
                <div class="dori-bar">
                    <div class="dori-segment seg-blind" title="<25 PPM Blind Zone">Blind</div>
                    <div class="dori-segment seg-detection" title="25-61 PPM (Optimum ~40)"><div class="opt-tick" style="left: 41%;"></div>D</div>
                    <div class="dori-segment seg-observation" title="62-124 PPM (Optimum ~80)"><div class="opt-tick" style="left: 29%;"></div>O</div>
                    <div class="dori-segment seg-recognition" title="125-249 PPM (Optimum ~150)"><div class="opt-tick" style="left: 20%;"></div>R</div>
                    <div class="dori-segment seg-identification" title="250+ PPM (Optimum ~300)"><div class="opt-tick" style="left: 33%;"></div>I</div>
                </div>
                <!-- Scale indicator -->
                <div id="scale-indicator" class="indicator" style="left: 0%;"></div>
            </div>

            <label style="display: block; margin-top: 24px; margin-bottom: 8px; color: var(--text-muted); font-size: 0.875rem;">Maximum Distances (click to apply):</label>
            <ul class="limits-list">
                <li id="li-limit-i" title="Business purpose (Identification): Detailed biometrics. Used for FaceID systems and strong identity evidence in court.">
                    <span style="color: var(--zone-identification)">Identification (≥250 PPM)</span>
                    <span class="dist" id="limit-i">0 m</span>
                </li>
                <li id="li-limit-r" title="Business purpose (Recognition): Clear license plate reading (LPR), recognition of familiar faces by security staff, and detailed cash-desk operation control.">
                    <span style="color: var(--zone-recognition)">Recognition (≥125 PPM)</span>
                    <span class="dist" id="limit-r">0 m</span>
                </li>
                <li id="li-limit-o" title="Business purpose (Observation): Situational control. Makes it possible to understand clothing color, whether a person is holding an object, and movement direction.">
                    <span style="color: var(--zone-observation)">Observation (≥62 PPM)</span>
                    <span class="dist" id="limit-o">0 m</span>
                </li>
                <li id="li-limit-d" title="Business purpose (Detection): Basic analytics. Records the fact that a perimeter was crossed or that there is movement in the distance.">
                    <span style="color: var(--zone-detection)">Detection (≥25 PPM)</span>
                    <span class="dist" id="limit-d">0 m</span>
                </li>
            </ul>
        </div>
    </div>
</div>

<script>
    // DOM Elements
    const elRes = document.getElementById('resolution');
    const elSens = document.getElementById('sensor');
    const elFocSlider = document.getElementById('focal-slider');
    const elFocInput = document.getElementById('focal-input');
    const elFocFixed = document.getElementById('focal-fixed');
    const elDistSlider = document.getElementById('dist-slider');
    const elDistInput = document.getElementById('dist-input');
    const elAngleSlider = document.getElementById('angle-slider');
    const elAngleInput = document.getElementById('angle-input');
    const opticsBtns = document.querySelectorAll('.optics-type-toggle button');
    
    const elHeightSlider = document.getElementById('height-slider');
    const elHeightInput = document.getElementById('height-input');
    const elTiltSlider = document.getElementById('tilt-slider');
    const elTiltInput = document.getElementById('tilt-input');
    const elTiltAuto = document.getElementById('tilt-auto');

    const resPpm = document.getElementById('res-ppm');
    const resFov = document.getElementById('res-fov');
    const resAngle = document.getElementById('res-angle');
    const resDist = document.getElementById('res-dist');
    
    const doriStatus = document.getElementById('dori-status');
    const scaleIndicator = document.getElementById('scale-indicator');
    
    const limitI = document.getElementById('limit-i');
    const limitR = document.getElementById('limit-r');
    const limitO = document.getElementById('limit-o');
    const limitD = document.getElementById('limit-d');

    function setDistance(groundDistance) {
        const height = Number(elHeightInput.value);
        const slant = Math.floor(Math.hypot(groundDistance, height) * 10) / 10;
        const value = Math.max(Number(elDistInput.min), Math.min(Number(elDistInput.max), slant));
        elDistSlider.value = value;
        elDistInput.value = value;
        calculate();
    }

    let isFixedLens = false;

    // Sync inputs and sliders
    function syncInput(source, target) {
        target.value = source.value;
        calculate();
    }

    elFocSlider.addEventListener('input', () => syncInput(elFocSlider, elFocInput));
    elFocInput.addEventListener('input', () => syncInput(elFocInput, elFocSlider));
    elDistSlider.addEventListener('input', () => syncInput(elDistSlider, elDistInput));
    elDistInput.addEventListener('input', () => syncInput(elDistInput, elDistSlider));

    elHeightSlider.addEventListener('input', () => syncInput(elHeightSlider, elHeightInput));
    elHeightInput.addEventListener('input', () => syncInput(elHeightInput, elHeightSlider));
    
    elTiltSlider.addEventListener('input', () => {
        elTiltInput.value = elTiltSlider.value;
        if (!elTiltAuto.checked) calculate();
    });
    elTiltInput.addEventListener('input', () => {
        elTiltSlider.value = elTiltInput.value;
        if (!elTiltAuto.checked) calculate();
    });
    
    elTiltAuto.addEventListener('change', () => {
        const isAuto = elTiltAuto.checked;
        elTiltSlider.disabled = isAuto;
        elTiltInput.disabled = isAuto;
        elTiltSlider.style.opacity = isAuto ? '0.5' : '1';
        elTiltInput.style.opacity = isAuto ? '0.5' : '1';
        calculate();
    });
    
    // Sync angle inputs
    elAngleSlider.addEventListener('input', () => {
        elAngleInput.value = elAngleSlider.value;
        updateFocalFromAngle();
    });
    elAngleInput.addEventListener('input', () => {
        elAngleSlider.value = elAngleInput.value;
        updateFocalFromAngle();
    });

    function updateFocalFromAngle() {
        if (isFixedLens) return; // Cannot change angle manually if fixed
        const angleDeg = parseFloat(elAngleInput.value);
        if (isNaN(angleDeg) || angleDeg <= 0 || angleDeg >= 180) return;
        const sensorW = parseFloat(elSens.value);
        const angleRad = angleDeg * Math.PI / 180;
        
        // Formula: FocalLength = SensorWidth / (2 * Math.tan(Angle_in_radians / 2))
        const focalL = sensorW / (2 * Math.tan(angleRad / 2));
        
        // Clamp to allowed focal length limits visually or allow overflow?
        // Let's just set the value. Range slider will cap visually.
        elFocInput.value = focalL.toFixed(2);
        elFocSlider.value = focalL.toFixed(2);
        
        calculate();
    }

    elRes.addEventListener('change', calculate);
    elSens.addEventListener('change', calculate);
    elFocFixed.addEventListener('change', () => {
        elFocSlider.value = elFocFixed.value;
        elFocInput.value = elFocFixed.value;
        calculate();
    });

    // Toggle Lens Type
    opticsBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            opticsBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            isFixedLens = btn.dataset.type === 'fixed';
            
            if (isFixedLens) {
                document.getElementById('focal-slider-group').style.display = 'none';
                elFocFixed.style.display = 'block';
                elFocSlider.value = elFocFixed.value;
                elFocInput.value = elFocFixed.value;
                
                elAngleSlider.disabled = true;
                elAngleInput.disabled = true;
                elAngleSlider.style.opacity = '0.5';
                elAngleInput.style.opacity = '0.5';
            } else {
                document.getElementById('focal-slider-group').style.display = 'flex';
                elFocFixed.style.display = 'none';
                
                elAngleSlider.disabled = false;
                elAngleInput.disabled = false;
                elAngleSlider.style.opacity = '1';
                elAngleInput.style.opacity = '1';
            }
            calculate();
        });
    });

    function calculate() {
        const resParts = elRes.value.split('x');
        const horizPx = parseFloat(resParts[0]);
        const vertPx = parseFloat(resParts[1]);
        
        const sensorOption = elSens.options[elSens.selectedIndex];
        const sensorW = parseFloat(sensorOption.value);
        const sensorH = parseFloat(sensorOption.getAttribute('data-height'));
        
        const focalL = parseFloat(elFocInput.value);
        const camHeight = parseFloat(elHeightInput.value);
        
        if (!validateInputs()) return;
        const hypotenuse = parseFloat(elDistInput.value);
        
        const dist = Math.sqrt(hypotenuse * hypotenuse - camHeight * camHeight); // Ground distance

        // 1. Angle Calculation
        const angleRad = 2 * Math.atan(sensorW / (2 * focalL));
        const angleDeg = angleRad * 180 / Math.PI;
        
        const vAngleRad = 2 * Math.atan(sensorH / (2 * focalL));

        if (document.activeElement !== elAngleSlider && document.activeElement !== elAngleInput) {
            elAngleSlider.value = angleDeg.toFixed(1);
            elAngleInput.value = angleDeg.toFixed(1);
        }
        
        // 2. Tilt Angle Logic
        let tiltDeg;
        if (elTiltAuto.checked) {
            tiltDeg = Math.atan(camHeight / dist) * 180 / Math.PI;
            if (dist === 0) tiltDeg = 90;
            elTiltSlider.value = tiltDeg.toFixed(1);
            elTiltInput.value = tiltDeg.toFixed(1);
        } else {
            tiltDeg = parseFloat(elTiltInput.value);
        }
        const tiltRad = tiltDeg * Math.PI / 180;

        // 3. Field of View Width & Height at target distance
        const fov = 2 * hypotenuse * Math.tan(angleRad / 2);
        const fovH = 2 * hypotenuse * Math.tan(vAngleRad / 2);

        // 4. Pixels Per Meter (PPM) at target distance
        const ppm = horizPx / fov;

        // Display basic results
        resAngle.innerText = angleDeg.toFixed(1) + '°';
        resFov.innerText = fov.toFixed(1) + ' m';
        resDist.innerText = dist.toFixed(1) + ' m';
        resPpm.innerText = Math.round(ppm);

        // Calculate Max 3D Diagonal Distances for DORI
        const calcMaxHypot = (targetPpm) => ((horizPx * focalL) / (targetPpm * sensorW));
        
        // Ground projections (D = sqrt(Hypot^2 - H^2))
        const getGroundDist = (hypot) => hypot > camHeight ? Math.sqrt(hypot * hypot - camHeight * camHeight) : 0;

        const valI_h = calcMaxHypot(250);
        const valR_h = calcMaxHypot(125);
        const valO_h = calcMaxHypot(62);
        const valD_h = calcMaxHypot(25);
        
        const valI = getGroundDist(valI_h);
        const valR = getGroundDist(valR_h);
        const valO = getGroundDist(valO_h);
        const valD = getGroundDist(valD_h);

        // Blind zone under camera based on bottom ray of V-FOV
        const bottomRayAngle = tiltRad + vAngleRad / 2;
        let dMin = 0;
        if (bottomRayAngle > 0) {
            dMin = camHeight / Math.tan(bottomRayAngle);
            if (dMin < 0) dMin = 0; // if it goes past vertical looking backwards
        } else {
            dMin = 9999; // camera looks above horizon entirely
        }

        limitI.innerText = valI.toFixed(1) + ' m';
        limitR.innerText = valR.toFixed(1) + ' m';
        limitO.innerText = valO.toFixed(1) + ' m';
        limitD.innerText = valD.toFixed(1) + ' m';

        document.getElementById('li-limit-i').onclick = () => setDistance(valI);
        document.getElementById('li-limit-r').onclick = () => setDistance(valR);
        document.getElementById('li-limit-o').onclick = () => setDistance(valO);
        document.getElementById('li-limit-d').onclick = () => setDistance(valD);

        // Update SVG Visual with distances
        updateSvg(angleRad, vAngleRad, tiltRad, fov, fovH, dist, camHeight, dMin, valI, valR, valO, valD);

        // Update Visualization
        updateVisualization(ppm);
    }

    function updateVisualization(ppm) {
        let statusText = "";
        let bgColor = "";
        let textColor = "#fff";
        let percent = 0; // for indicator position

        // Calculate position on the bar (max limit around 350 for visual scale)
        // Let's map PPM to percentage non-linearly to match our visual segments
        // 0-25: 0-10%
        // 25-61: 10-25%
        // 62-124: 25-45%
        // 125-249: 45-70%
        // >=250: 70-100%

        if (ppm < 25) {
            statusText = "Blind Zone (Insufficient Detail)";
            bgColor = "var(--zone-blind)";
            percent = (ppm / 25) * 10;
        } else if (ppm < 62) {
            statusText = "Detection - Silhouette visible";
            bgColor = "var(--zone-detection)";
            percent = 10 + ((ppm - 25) / (61 - 25)) * 15;
        } else if (ppm < 125) {
            statusText = "Observation - Basic attributes visible";
            bgColor = "var(--zone-observation)";
            percent = 25 + ((ppm - 62) / (124 - 62)) * 20;
        } else if (ppm < 250) {
            statusText = "Recognition - Faces/license plates recognizable";
            bgColor = "var(--zone-recognition)";
            textColor = "#000";
            percent = 45 + ((ppm - 125) / (249 - 125)) * 25;
        } else {
            statusText = "Identification - Detailed biometrics";
            bgColor = "var(--zone-identification)";
            percent = 70 + Math.min((ppm - 250) / 150, 1) * 30;
        }

        doriStatus.innerText = statusText;
        doriStatus.style.backgroundColor = bgColor;
        doriStatus.style.color = textColor;
        
        // Ensure percent doesn't go over 100%
        percent = Math.max(0, Math.min(100, percent));
        scaleIndicator.style.left = `calc(${percent}% - 2px)`; // center the 4px indicator
        
        resPpm.style.color = bgColor;
    }

    function updateSvg(angleRad, vAngleRad, tiltRad, fovW, fovH, dist, camHeight, dMin, valI, valR, valO, valD) {
        document.getElementById('scene-width-label').innerText = fovW.toFixed(1) + ' m';
        document.getElementById('scene-height-label').innerText = fovH.toFixed(1) + ' m';
        
        const textDist = document.getElementById('svg-dist-text');
        textDist.textContent = `${dist.toFixed(1)} m ground`;

        // ---- 1. TOP VIEW (fov-svg) ----
        const cx = 150;
        const cy = 14;
        const maxH = 116; 
        
        // For top view, max distance scale
        const visibleDistMax = Math.max(dist * 1.1, valO); 
        const pxPerMeter = maxH / visibleDistMax;
        // Separate axis scales keep narrow, long-range coverage readable.
        const xScale = Math.min(28, 110 / Math.max(fovW / 2, 0.1));
        const drawH = dist * pxPerMeter;
        
        // Clip poly for top view
        const clipPoly = document.getElementById('fov-poly');
        const outlinePoly = document.getElementById('fov-poly-outline');
        
        const maxDrawHalfW = Math.min(140, visibleDistMax * Math.tan(angleRad / 2) * xScale);
        const pointsStr = `${cx},${cy + dMin * pxPerMeter} ${cx - maxDrawHalfW},${cy + maxH} ${cx + maxDrawHalfW},${cy + maxH}`;
        clipPoly.setAttribute('points', pointsStr);
        outlinePoly.setAttribute('points', pointsStr);
        
        const yMin = cy + dMin * pxPerMeter;
        const yI = cy + Math.max(dMin, valI) * pxPerMeter;
        const yR = cy + Math.max(dMin, valR) * pxPerMeter;
        const yO = cy + Math.max(dMin, valO) * pxPerMeter;
        const yD = cy + Math.max(dMin, valD) * pxPerMeter;

        const rectI = document.getElementById('rect-i');
        const rectR = document.getElementById('rect-r');
        const rectO = document.getElementById('rect-o');
        const rectD = document.getElementById('rect-d');
        
        rectI.setAttribute('y', yMin);
        rectI.setAttribute('height', Math.max(0, yI - yMin));
        rectR.setAttribute('y', yI);
        rectR.setAttribute('height', Math.max(0, yR - yI));
        rectO.setAttribute('y', yR);
        rectO.setAttribute('height', Math.max(0, yO - yR));
        rectD.setAttribute('y', yO);
        rectD.setAttribute('height', Math.max(0, yD - yO));

        const targetLine = document.getElementById('target-dist-line');
        const ty = cy + drawH;
        const drawHalfW = Math.min(140, fovW / 2 * xScale);
        targetLine.setAttribute('y1', ty);
        targetLine.setAttribute('y2', ty);
        
        // Hide target line if it is in the blind zone (behind dMin)
        if (ty < yMin) {
            targetLine.setAttribute('opacity', '0');
        } else {
            targetLine.setAttribute('opacity', '1');
            targetLine.setAttribute('x1', cx - drawHalfW);
            targetLine.setAttribute('x2', cx + drawHalfW);
        }
        
        textDist.setAttribute('y', ty - 6);

        // ---- 2. SIDE VIEW (side-svg) — Professional Engineering Drawing ----
        // SVG constants
        const SV = {
            W: 420, H: 240,
            originX: 44,   // x of the pole / camera
            groundY: 200,  // y of the ground line
            topY: 4,       // top margin
            rightX: 416,   // right edge
        };

        // Compute scale: keep 1:1 physical ratio if possible
        // horizontal span: rightX - originX = 372px
        // vertical span: groundY - topY = 196px
        const physH = Math.max(camHeight * 1.35, 4);   // physical height domain
        const physW = Math.max(dist * 1.15, physH * (372/196)); // physical horiz domain

        const scX = (372) / physW;
        const scY = (196) / physH;

        // SVG coordinate helpers
        const svgX = (d) => SV.originX + d * scX;
        const svgY = (h) => SV.groundY - h * scY;

        // Camera position in SVG
        const camSvgX = SV.originX;
        const camSvgY = svgY(camHeight);

        // Physical ray angles (from horizontal, positive = downward)
        // tiltRad = angle from horizontal the camera is tilted down
        const topRayAngle = tiltRad - vAngleRad / 2;   // above center (might be negative = looking up)
        const botRayAngle = tiltRad + vAngleRad / 2;   // below center

        // Ray endpoint helper: given angle (down from horizontal), distance d along ground
        // We compute where the ray intersects various things
        // Height at ground distance d: h(d) = camHeight - d*tan(angle)
        const rayH = (d, angle) => camHeight - d * Math.tan(angle);

        // Clip distance where a ray hits the ground (h=0)
        const rayGroundDist = (angle) => angle > 0.001 ? camHeight / Math.tan(angle) : physW * 2;
        const rayTopDist = (angle) => angle < -0.001 ? -camHeight / Math.tan(angle) : physW * 2;

        const botGroundD = rayGroundDist(botRayAngle);
        const topGroundD = rayGroundDist(topRayAngle);

        // ---- Draw Grid ----
        const gridGroup = document.getElementById('side-grid');
        gridGroup.innerHTML = '';
        
        // Horizontal (height) grid lines
        const hStep = physH > 8 ? 2 : 1;
        for (let h = 0; h <= physH; h += hStep) {
            const y = svgY(h);
            if (y < SV.topY || y > SV.groundY) continue;
            const isMajor = (h % (hStep * 2) === 0);
            gridGroup.innerHTML += `<line x1="${SV.originX}" x2="${SV.rightX}" y1="${y}" y2="${y}" stroke="${isMajor ? '#1e3a5f' : '#111827'}" stroke-width="${isMajor ? 1 : 0.5}"/>`;
            if (isMajor && h > 0) {
                gridGroup.innerHTML += `<text x="37" y="${y + 3}" fill="#334155" font-size="8" text-anchor="end">${h}m</text>`;
            }
        }
        // Vertical (distance) grid lines
        const dStep = physW > 30 ? 10 : physW > 15 ? 5 : 2;
        for (let d = 0; d <= physW; d += dStep) {
            const x = svgX(d);
            if (x < SV.originX || x > SV.rightX) continue;
            const isMajor = (d % (dStep * 2) === 0);
            gridGroup.innerHTML += `<line x1="${x}" x2="${x}" y1="${SV.topY}" y2="${SV.groundY}" stroke="${isMajor ? '#1e3a5f' : '#111827'}" stroke-width="${isMajor ? 1 : 0.5}"/>`;
            if (isMajor && d > 0) {
                gridGroup.innerHTML += `<text x="${x}" y="${SV.groundY + 10}" fill="#334155" font-size="8" text-anchor="middle">${d}</text>`;
            }
        }
        // Distance axis label
        gridGroup.innerHTML += `<text x="${SV.rightX}" y="${SV.groundY + 10}" fill="#334155" font-size="8" text-anchor="end">m -></text>`;

        // ---- Draw DORI zone slices ----
        // Each zone is a trapezoid between two distances along the two rays
        const hypotenuse = Math.sqrt(dist * dist + camHeight * camHeight);
        
        // Return points for a quad representing a zone between dist d1 and d2 (distance from camera)
        const conePoints = (d1, d2) => {
            const t1 = d1 / Math.cos(vAngleRad / 2);
            const t2 = d2 / Math.cos(vAngleRad / 2);
            
            const pts = [];
            // top ray intersection
            pts.push([svgX(t1 * Math.cos(topRayAngle)), svgY(camHeight - t1 * Math.sin(topRayAngle))]);
            pts.push([svgX(t2 * Math.cos(topRayAngle)), svgY(camHeight - t2 * Math.sin(topRayAngle))]);
            // bottom ray intersection
            pts.push([svgX(t2 * Math.cos(botRayAngle)), svgY(camHeight - t2 * Math.sin(botRayAngle))]);
            pts.push([svgX(t1 * Math.cos(botRayAngle)), svgY(camHeight - t1 * Math.sin(botRayAngle))]);
            
            return pts.map(p => p.join(',')).join(' ');
        };

        const setZone = (id, d1, d2) => {
            const el = document.getElementById(id);
            if (!el) return;
            if (d2 <= d1 || d1 >= physW * 1.5) { el.setAttribute('opacity', '0'); return; }
            el.setAttribute('opacity', '0.55');
            el.setAttribute('points', conePoints(d1, Math.min(d2, physW * 1.5)));
        };
        setZone('side-i', 0, valI);
        setZone('side-r', valI, valR);
        setZone('side-o', valR, valO);
        setZone('side-d', valO, valD);

        // ---- Blind zone (triangle below bottom ray, near camera) ----
        const blindEl = document.getElementById('side-blind');
        const blindTopEl = document.getElementById('side-blind-top');
        if (blindEl) blindEl.setAttribute('opacity', '0'); // disable old one
        if (blindTopEl) {
            const bPts = [];
            bPts.push([camSvgX, camSvgY]);
            if (botRayAngle > 0.001) {
                bPts.push([svgX(botGroundD), SV.groundY]);
            } else {
                bPts.push([SV.rightX, SV.groundY]);
            }
            bPts.push([SV.originX, SV.groundY]);
            blindTopEl.setAttribute('points', bPts.map(p => p.join(',')).join(' '));

        if (poleEl) {

            poleEl.setAttribute('y1', camSvgY);
            poleEl.setAttribute('y2', SV.groundY);
        }

        // ---- Camera icon: rotate to tilt angle (compensated for non-1:1 scale) ----
        const camGroup = document.getElementById('side-cam-group');
        if (camGroup) {

            const svgTiltDeg = Math.atan(Math.tan(tiltRad) * (scY / scX)) * 180 / Math.PI;
            camGroup.setAttribute('transform', `translate(${camSvgX}, ${camSvgY}) rotate(${svgTiltDeg})`);

        if (hypLine) {

            hypLine.setAttribute('x2', targetSvgX);
            hypLine.setAttribute('y2', SV.groundY);

        const botRayEl = document.getElementById('side-bot-ray');

        const botEndD = Math.min(botGroundD, physW);

            topRayEl.setAttribute('x1', camSvgX);
            topRayEl.setAttribute('y1', camSvgY);
            topRayEl.setAttribute('x2', svgX(topEndD));
            topRayEl.setAttribute('y2', svgY(Math.max(0, rayH(topEndD, topRayAngle))));
        }
        if (botRayEl) {
            botRayEl.setAttribute('x1', camSvgX);
            botRayEl.setAttribute('y1', camSvgY);
            botRayEl.setAttribute('x2', svgX(botEndD));
            botRayEl.setAttribute('y2', SV.groundY);
        }

        const hdimLine = document.getElementById('side-hdim-line');
        const hdimTop  = document.getElementById('side-hdim-top');
        const hdimBot  = document.getElementById('side-hdim-bot');
        const hdimText = document.getElementById('side-hdim-text');
        if (hdimLine) {
            hdimLine.setAttribute('y1', camSvgY);
            hdimLine.setAttribute('y2', SV.groundY);
            hdimTop.setAttribute('y1', camSvgY); hdimTop.setAttribute('y2', camSvgY);
            const midY = (camSvgY + SV.groundY) / 2;
            hdimText.setAttribute('y', midY + 3);
            hdimText.setAttribute('transform', `rotate(-90, 18, ${midY})`);
            hdimText.textContent = `H = ${camHeight.toFixed(1)} m`;
        }

        // ---- Hypotenuse label (at midpoint of the dashed line) ----
        const hypText = document.getElementById('side-hyp-text');
        if (hypText) {
            const mx = (camSvgX + targetSvgX) / 2;
            const my = (camSvgY + SV.groundY) / 2;
            hypText.setAttribute('x', mx + 8);
            hypText.setAttribute('y', my - 6);
            hypText.textContent = `🎯 ${hypotenuse.toFixed(1)} m`;
        }

        // ---- Ground distance dimension ----
        const gdimLine = document.getElementById('side-gdim-line');
        const gdimText = document.getElementById('side-gdim-text');
        if (gdimLine) {
            gdimLine.setAttribute('x1', camSvgX);
            gdimLine.setAttribute('x2', targetSvgX);
            gdimText.setAttribute('x', (camSvgX + targetSvgX) / 2);
            gdimText.textContent = `${dist.toFixed(1)} m (ground)`;
        }

        // ---- Target person (1.7m at median line intersection with floor) ----
        const person17Group = document.getElementById('side-person-17');
        if (person17Group) {
            // Find distance where median line hits ground
            const medianGroundD = (tiltRad > 0.001) ? camHeight / Math.tan(tiltRad) : physW * 2;
            const pxX = svgX(medianGroundD);
            person17Group.setAttribute('transform', `translate(${pxX}, ${SV.groundY})`);
            
            const pBodyPx = 1.45 * scY;
            const pHeadPx = 0.125 * scY;
            const bodyEl17 = document.getElementById('person-17-body');
            const headEl17 = document.getElementById('person-17-head');
            if (bodyEl17) bodyEl17.setAttribute('y2', -pBodyPx);
            if (headEl17) {
                headEl17.setAttribute('cy', -(pBodyPx + pHeadPx + 1));
                headEl17.setAttribute('r', pHeadPx);
            }
        }
        
        // ---- Target person (target distance) ----
        const personGroup = document.getElementById('side-person');
        if (personGroup) {
            personGroup.setAttribute('transform', `translate(${targetSvgX}, ${SV.groundY})`);
            const personBodyPx = 1.5 * scY;
            const personHeadPx = Math.max(3, 0.15 * scY);
            const bodyEl = document.getElementById('person-body');
            const headEl = document.getElementById('person-head');
            if (bodyEl) bodyEl.setAttribute('y2', -personBodyPx);
            if (headEl) {
                headEl.setAttribute('cy', -(personBodyPx + personHeadPx + 1));
                headEl.setAttribute('r', personHeadPx);
            }
        }

        // ---- Info row below SVG ----
        const heightLabelEl = document.getElementById('scene-height-label');
        if (heightLabelEl) heightLabelEl.innerText = fovH.toFixed(1) + ' m';
        
        const blindInfoEl = document.getElementById('side-blind-info');
        if (blindInfoEl) {
            const blindDist = botGroundD < dist ? botGroundD.toFixed(1) + ' m' : '0 m';
            blindInfoEl.textContent = `Blind Zone: ${blindDist}`;
        }
        const horizInfoEl = document.getElementById('side-horiz-info');
        if (horizInfoEl) horizInfoEl.textContent = `Ground: ${dist.toFixed(1)} m`;

        // ---- Zone label at head position ----
        const zoneLabelEl = document.getElementById('side-zone-label');
        if (zoneLabelEl) {
            const headH = 1.65;
            let zoneLabel = '—';
            const ppm_at_target = parseFloat(document.getElementById('res-ppm')?.innerText) || 0;
            if (ppm_at_target >= 300) zoneLabel = '🔴 Identification';

            else if (ppm_at_target >= 80) zoneLabel = '🔵 Observation';
            else if (ppm_at_target >= 40) zoneLabel = '🟢 Detection';
            else zoneLabel = '⚫ Blind zone';
            zoneLabelEl.setAttribute('x', targetSvgX + 10);
            zoneLabelEl.setAttribute('y', svgY(headH) - 4);
            zoneLabelEl.textContent = zoneLabel;
        }
    }

    // Init
    calculate();
</script>
