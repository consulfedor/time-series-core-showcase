<!doctype html>
<html lang="ru" data-theme="graphite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#17191c">
  <title>Урок 1 — Английский</title>
  <link rel="canonical" href="https://consulfedor.github.io/time-series-core-showcase/english/lesson.html">
  <link rel="stylesheet" href="./player.css">
  <link rel="stylesheet" href="./lesson.css">
  <script src="./player.js" defer></script>
</head>
<body class="lesson-page">
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m10 5-7 7 7 7M3 12h18"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 3a9 9 0 0 1 0 18z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M4 4v12h5m-5-8h5m7-4h4v8h-4zM9 4h4v8H9zm0 12h4v4H9zm7 0h4v4h-4z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m10 5 7 7-7 7"/></symbol>
    <symbol id="i-block-left" viewBox="0 0 24 24"><path d="M5 5v14m14-14-8 7 8 7"/></symbol>
    <symbol id="i-block-right" viewBox="0 0 24 24"><path d="M19 5v14M5 5l8 7-8 7"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 3 4 4-4 4M3 11V9a2 2 0 0 1 2-2h16M7 21l-4-4 4-4m14 0v2a2 2 0 0 1-2 2H3"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4 4v6h6M4.5 10a8 8 0 1 1 .5 6"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-return" viewBox="0 0 24 24"><path d="m8 5-5 5 5 5m-5-5h12a6 6 0 0 1 0 12"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="m7 9 5-5 5 5m-10 6 5 5 5-5"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="m7 4 5 5 5-5M7 20l5-5 5 5"/></symbol>
  </svg>

  <header class="lesson-header">
    <div class="header-navigation">
      <a class="back-link" href="./index.html" aria-label="К урокам"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span>К урокам</span></a>
      <button class="icon-button map-toggle" id="open-drawer" type="button" aria-label="Открыть карту урока" aria-expanded="false" aria-controls="lesson-nav" title="Карта урока"><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg></button>
    </div>
    <div class="lesson-identity">
      <p id="course-label">Пимслер · Уровень I</p>
      <h1><span id="lesson-heading">Урок 1</span><span class="identity-divider" aria-hidden="true">/</span><span id="lesson-description">Первое знакомство</span></h1>
    </div>
    <div class="header-settings" aria-label="Настройки занятия">
      <div class="type-controls" role="group" aria-label="Размер текста">
        <button id="text-smaller" type="button" aria-label="Уменьшить текст" title="Уменьшить текст">A<span aria-hidden="true">−</span></button>
        <button id="text-larger" type="button" aria-label="Увеличить текст" title="Увеличить текст">A<span aria-hidden="true">+</span></button>
      </div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Включить светлую тему" title="Сменить тему"><svg class="icon" aria-hidden="true"><use href="#i-theme"/></svg></button>
      <button class="completion-button" id="completion-toggle" type="button" aria-pressed="false" title="Отметить урок как изученный"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span>Изучил</span></button>
    </div>
  </header>

  <div class="lesson-shell">
    <div class="drawer-scrim" id="drawer-scrim" hidden></div>
    <aside class="lesson-nav" id="lesson-nav" aria-label="Карта урока">
      <div class="nav-head">
        <div class="nav-title-row"><h2>Карта урока</h2><button class="icon-button drawer-close" id="close-drawer" type="button" aria-label="Закрыть карту урока"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
        <div class="nav-progress-row"><div class="nav-progress"><span id="nav-progress-fill"></span></div><span id="nav-progress-label">0%</span></div>
        <div class="tree-actions">
          <button id="expand-all" type="button"><svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg>Раскрыть</button>
          <button id="collapse-all" type="button"><svg class="icon" aria-hidden="true"><use href="#i-collapse"/></svg>Свернуть</button>
        </div>
      </div>
      <div class="lesson-tree" id="lesson-tree"></div>
    </aside>

    <main class="player-main" aria-label="Занятие">
      <p class="player-notice" id="player-notice" role="status" hidden></p>
      <p class="player-notice storage-notice" id="storage-notice" role="status" hidden></p>
      <section class="learning-stage" id="learning-stage" aria-label="Караоке и образ для запоминания">
        <div class="focus-panel">
          <div class="karaoke-wrap"><div id="karaoke-text" class="karaoke-text" aria-live="off">Загружаем урок…</div></div>
        </div>
        <section class="scene-card" id="scene-card" aria-label="Образ для запоминания" hidden>
          <div class="scene-copy">
            <h2 id="scene-term"></h2>
            <p class="scene-meaning" id="scene-meaning"></p>
            <p class="scene-description" id="scene-description"></p>
          </div>
          <div class="scene-window">
            <div class="scene-art" id="scene-art" data-animation="" data-step="0">
              <img class="scene-image" id="scene-image" src="" alt="" hidden>
              <span class="scene-drop" id="scene-drop" aria-hidden="true" hidden></span>
              <img class="scene-piece piece-left" id="scene-piece-left" src="" alt="" aria-hidden="true" hidden>
              <img class="scene-piece piece-right" id="scene-piece-right" src="" alt="" aria-hidden="true" hidden>
              <img class="scene-piece piece-base" id="scene-piece-base" src="" alt="" aria-hidden="true" hidden>
            </div>
          </div>
        </section>
      </section>

      <section class="transport" aria-label="Управление воспроизведением">
        <div class="timeline-row">
          <span class="time-value" id="current-time">0:00</span>
          <input id="seek-range" type="range" min="0" max="1" step="0.01" value="0" aria-label="Позиция в уроке" disabled>
          <span class="time-value" id="duration-time">29:32</span>
        </div>
        <div class="transport-main">
          <div class="repeat-controls" role="group" aria-label="Повтор">
            <button class="control-button" id="repeat-phrase" type="button" aria-label="Повторить текущую фразу" title="Повторить текущую фразу" disabled><svg class="icon" aria-hidden="true"><use href="#i-replay"/></svg><span>Фраза</span></button>
            <button class="control-button" id="repeat-block" type="button" aria-label="Повторить текущий блок" title="Повторить текущий блок" disabled><svg class="icon" aria-hidden="true"><use href="#i-replay"/></svg><span>Блок</span></button>
          </div>
          <div class="navigation-controls" role="group" aria-label="Переходы">
            <button class="step-button" id="previous-block" type="button" aria-label="Предыдущий блок" title="Предыдущий блок" disabled><svg class="icon" aria-hidden="true"><use href="#i-block-left"/></svg><span>Блок</span></button>
            <button class="step-button" id="previous-phrase" type="button" aria-label="Предыдущая фраза" title="Предыдущая фраза" disabled><svg class="icon" aria-hidden="true"><use href="#i-left"/></svg><span>Фраза</span></button>
            <button class="play-button" id="play-toggle" type="button" aria-label="Воспроизвести" data-state="paused" disabled><svg class="icon icon-play" aria-hidden="true"><use href="#i-play"/></svg><svg class="icon icon-pause" aria-hidden="true"><use href="#i-pause"/></svg></button>
            <button class="step-button" id="next-phrase" type="button" aria-label="Следующая фраза" title="Следующая фраза" disabled><svg class="icon" aria-hidden="true"><use href="#i-right"/></svg><span>Фраза</span></button>
            <button class="step-button" id="next-block" type="button" aria-label="Следующий блок" title="Следующий блок" disabled><svg class="icon" aria-hidden="true"><use href="#i-block-right"/></svg><span>Блок</span></button>
          </div>
          <button class="control-button return-button" id="return-position" type="button" disabled title="Вернуться к позиции до последнего перехода"><svg class="icon" aria-hidden="true"><use href="#i-return"/></svg><span>К месту</span></button>
        </div>
        <div class="transport-options">
          <label class="loop-control" title="Повторять текущий смысловой блок по кругу"><input id="loop-block" type="checkbox" disabled><svg class="icon" aria-hidden="true"><use href="#i-repeat"/></svg><span>Блок по кругу</span></label>
          <button class="control-button bookmark-button" id="difficult-toggle" type="button" disabled aria-pressed="false" title="Отметить фразу для повторения — закладка появится в карте урока"><svg class="icon" aria-hidden="true"><use href="#i-bookmark"/></svg><span>На повтор</span></button>
          <label class="speed-control"><span>Скорость</span><select id="playback-rate" aria-label="Скорость воспроизведения" disabled><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option></select></label>
          <label class="volume-control"><svg class="icon" aria-hidden="true"><use href="#i-volume"/></svg><input id="volume-range" type="range" min="0" max="1" step="0.01" value="1" aria-label="Громкость" disabled></label>
        </div>
        <audio id="lesson-audio" preload="metadata"></audio>
      </section>
    </main>
  </div>
</body>
</html>
