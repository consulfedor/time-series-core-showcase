<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>MyTwoBrain · Workspace demo</title>
  <link rel="stylesheet" href="../vendor/oz_markdown.css">
  <link rel="stylesheet" href="workspace-demo.css">
</head>
<body>
  <div class="container session-view demo-shell" id="demo-shell">
    <header class="demo-notice">
      <span><i aria-hidden="true"></i><strong data-i18n="demoLabel">Демонстрация · примеры данных</strong></span>
      <div class="notice-actions">
        <button type="button" data-demo-action="guide" data-help="guide" data-i18n="guide">Как пользоваться</button>
        <button type="button" data-demo-action="reset" data-help="reset" data-i18n="reset">Сначала</button>
      </div>
    </header>
    <main class="session-layout" id="session-layout">
      <div class="conversation-column">
        <section class="dialog-pane panel" aria-labelledby="dialog-title">
          <header class="header viewer-header session-header" id="session-header">
            <div class="viewer-title-row session-title"><h1 id="dialog-title">D001 · Рабочий пример</h1><span class="session-zone" data-i18n="readingZone">1 · Чтение диалога</span></div>
            <div class="viewer-actions viewer-actions-row session-header-actions" aria-label="Действия сессии" data-label="sessionActions">
              <button type="button" id="btnDialogSurface" data-demo-action="dialog-view" data-help="dialogView" data-label="dialogView" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-7l-5 4v-4H5a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1Z"/><path d="M8 8.5h8M8 12h6"/></svg></button>
              <button type="button" id="btnTerminalV2Surface" data-demo-action="terminal-view" data-help="terminalView" data-label="terminalView" aria-pressed="false"><i class="terminal-presence" aria-hidden="true"></i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="m7 8 3 3-3 3M12 15h5"/></svg></button>
              <button type="button" id="btnSessionMetaEdit" data-demo-action="profile" data-help="sessionProfile" data-label="sessionProfile"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 3v3m6-3v3M9 18v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3"/></svg></button>
              <button type="button" id="btnBookmarks" class="session-pin" data-demo-action="session-bookmark" data-help="sessionBookmarks" data-label="sessionBookmarks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3 7 7-3 1-4 4-1 4-3-3-6 6 5-7-3-3 4-1 4-4Z"/></svg></button>
              <button type="button" id="btnPrevUser" data-demo-action="previous-message" data-help="previousUser" data-label="previousUser">↑ 1</button>
              <button type="button" id="btnNextUser" data-demo-action="next-message" data-help="nextUser" data-label="nextUser">↓ 1</button>
              <button type="button" id="btnDialogLiveNotice" class="dialog-live-notice" data-demo-action="new-messages" data-help="newMessages" data-label="newMessages">New</button>
              <button type="button" id="sessionActionsToggle" data-demo-action="session-more" data-help="sessionMore" data-label="sessionMore" aria-haspopup="dialog">…</button>
            </div>
          </header>
          <div id="dialog-queue-rail" class="dialog-queue-rail"></div>
          <div class="chat-stream" id="chat-stream" tabindex="0" aria-label="Диалог с примерами"></div>
          <section id="terminal-view" class="terminal-v2-view" aria-label="Терминал с примерами" hidden></section>
        </section>
        <section class="runtime-composer-card composer-pane panel" aria-labelledby="composer-title">
          <header class="panel-header composer-heading">
            <div class="panel-title"><span class="zone-badge">2</span><h2 id="composer-title" data-i18n="composer">Задача и состояние</h2></div>
            <button type="button" class="runtime-composer-presence-pill status-pill" data-demo-action="status" data-help="status"><i aria-hidden="true"></i><span data-i18n="ready">Готов к примеру</span></button>
          </header>
          <p class="zone-intro" data-i18n="zone2">Задайте цель, добавьте материал, уточните способ работы.</p>
          <form id="composer-form" class="runtime-composer">
            <label class="visually-hidden" for="composer-input" data-i18n="promptLabel">Текст задачи</label>
            <textarea id="composer-input" data-source-id="runtimeComposerText" rows="3" data-placeholder="promptPlaceholder" placeholder="Например: преврати обсуждение в план из трёх шагов…" data-help="composerInput"></textarea>
            <div id="attachment-list" class="attachment-list"></div>
            <footer class="runtime-composer-actions composer-footer">
              <div class="runtime-composer-actions-left toolbar">
                <button type="button" class="mini ghost" data-source-id="runtimeComposerHistoryToggle" data-demo-action="buff" data-help="buff" data-i18n="buff">🗃 Buff</button>
                <button type="button" class="mini ghost runtime-composer-btn-danger" data-source-id="runtimeComposerClear" data-demo-action="clear-draft" data-help="clearDraft" aria-label="Очистить поле">⌫</button>
                <button type="button" class="mini ghost" data-source-id="runtimeComposerAttach" data-demo-action="attach" data-help="attach" aria-label="Добавить материал">📎</button>
                <button type="button" data-demo-action="voice" data-help="voice" data-i18n="voice">Голос</button>
              </div>
              <div class="runtime-composer-actions-right toolbar">
                <button type="button" class="mini ghost" data-source-id="runtimeComposerContinueCurrentGoal" data-demo-action="continue" data-help="continue" data-i18n="continue">Continue</button>
                <button type="button" class="mini ghost" data-source-id="runtimeComposerQueue" data-demo-action="queue" data-help="queue" data-i18n="queue">⇥ Tab</button>
                <button type="submit" class="mini primary" data-source-id="runtimeComposerSend" data-demo-action="send" data-help="send" data-i18n="send">↵ Send</button>
              </div>
            </footer>
          </form>
          <span class="composer-footnote" data-i18n="localReply">Ответ показывает подготовленный сценарий работы.</span>
        </section>
      </div>
      <aside class="session-side-switch workspace-pane panel" aria-labelledby="workspace-title">
        <header class="session-side-switch-head panel-header">
          <div class="panel-title"><span class="zone-badge">3</span><h2 id="workspace-title" data-i18n="workspace">Рабочее пространство</h2></div>
          <button type="button" data-demo-action="workspace-help" data-help="workspaceHelp" aria-label="О рабочем пространстве">?</button>
        </header>
        <p class="zone-intro" data-i18n="zone3">Материалы, план и контекст доступны рядом с диалогом.</p>
        <nav class="session-side-tabs workspace-tabs" id="workspace-tabs" role="tablist" aria-label="Рабочее пространство">
          <button type="button" class="session-side-tab" role="tab" data-tab="bookmarks" data-demo-action="tab" data-help="tabBookmarks" id="tab-bookmarks" aria-controls="workspace-panel" aria-selected="false" data-i18n="tabBookmarks">Закладки</button>
          <button type="button" class="session-side-tab" role="tab" data-tab="agents" data-demo-action="tab" data-help="tabAgents" id="tab-agents" aria-controls="workspace-panel" aria-selected="false" data-i18n="tabAgents">Агенты</button>
          <button type="button" class="session-side-tab" role="tab" data-tab="plan" data-demo-action="tab" data-help="tabPlan" id="tab-plan" aria-controls="workspace-panel" aria-selected="false" data-i18n="tabPlan">План</button>
          <button type="button" class="session-side-tab" role="tab" data-tab="docs" data-demo-action="tab" data-help="tabDocs" id="tab-docs" aria-controls="workspace-panel" aria-selected="true" data-i18n="tabDocs">Документы</button>
          <button type="button" class="session-side-tab" role="tab" data-tab="context" data-demo-action="tab" data-help="tabContext" id="tab-context" aria-controls="workspace-panel" aria-selected="false" data-i18n="tabContext">Контекст</button>
          <button type="button" class="session-side-tab" role="tab" data-tab="focus" data-demo-action="tab" data-help="tabFocus" id="tab-focus" aria-controls="workspace-panel" aria-selected="false" data-i18n="tabFocus">Фокус</button>
          <button type="button" class="session-side-tab" role="tab" data-tab="translation" data-demo-action="tab" data-help="tabTranslation" id="tab-translation" aria-controls="workspace-panel" aria-selected="false" data-i18n="tabTranslation">Перевод</button>
          <button type="button" class="session-side-tab" role="tab" data-tab="board" data-demo-action="tab" data-help="tabBoard" id="tab-board" aria-controls="workspace-panel" aria-selected="false" data-i18n="tabBoard">Доска</button>
        </nav>
        <div class="session-side-pane workspace-panel" id="workspace-panel" role="tabpanel" aria-labelledby="tab-docs" tabindex="0"></div>
      </aside>
    </main>
    <div class="sr-status visually-hidden" id="sr-status" aria-live="polite"></div>
  </div>
  <div id="selection-toolbar" class="dialog-selection-menu" role="toolbar" aria-label="Действия с выделением" data-label="selectionActions" hidden></div>
  <div class="business-tooltip" id="business-tooltip" role="tooltip" hidden></div>
  <dialog id="demo-dialog" class="bm-modal" aria-labelledby="modal-title">
    <header class="modal-header"><h2 id="modal-title"></h2><button type="button" data-demo-action="close-modal" data-help="close" aria-label="Закрыть">×</button></header>
    <div id="modal-body" class="modal-body"></div>
    <footer class="modal-footer"><span data-i18n="exampleData">Пример данных</span><button type="button" class="primary" data-demo-action="close-modal" data-help="close" data-i18n="close">Закрыть</button></footer>
  </dialog>
  <script src="../vendor/mermaid.min.js"></script>
  <script src="../vendor/oz_markdown_diagrams.js"></script>
  <script src="../vendor/oz_markdown.js"></script>
  <script src="workspace-demo-content.js"></script>
  <script src="workspace-demo.js"></script>
</body>
</html>
